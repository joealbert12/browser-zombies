<style>
/* Layout: canvas fills the viewport, HUD floats over it. One committed theme --
   a derelict theatre is dark in every light, so there is no second palette. */
:root{
  --blood:#9B1F15; --blood-hi:#D4573F; --amber:#E9C271; --ink:#F0E8D9;
  --faint:#8B8070; --glass:rgba(8,7,6,.5); --edge:rgba(233,194,113,.32);
  --hud:'Oswald',Impact,'Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:#050404;color:var(--ink);font-family:var(--hud);
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}

.hud{position:absolute;inset:0;pointer-events:none}
.round{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;
  font-size:12px;letter-spacing:3px;color:var(--blood-hi);text-transform:uppercase}
.round b{display:block;font-size:42px;line-height:.92;color:var(--blood);
  text-shadow:0 0 22px rgba(155,31,21,.9),2px 2px 0 #000}
.pts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;text-align:right}
.pts b{font-size:32px;color:var(--amber);text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
.pts span{display:block;font-size:10px;letter-spacing:3px;color:var(--faint)}
.gun{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);text-align:right}
.gun b{font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000}
.gun i{font-style:normal;color:var(--faint);font-size:17px}
.gun span{display:block;font-size:11px;letter-spacing:2.5px;color:var(--faint)}
.xh{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;opacity:.7}
.xh::before,.xh::after{content:'';position:absolute;background:var(--ink)}
.xh::before{left:50%;top:0;width:1.5px;height:100%;margin-left:-.75px}
.xh::after{top:50%;left:0;height:1.5px;width:100%;margin-top:-.75px}
.hurt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 140px 36px rgba(155,31,21,.9)}
.hurt.on{opacity:1;transition:opacity .05s}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:32px;
  letter-spacing:6px;color:var(--blood-hi);text-transform:uppercase;text-align:center;
  text-shadow:0 0 26px #000,2px 2px 0 #000;opacity:0;transition:opacity .5s}
.toast.on{opacity:1}
.buy{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 186px);
  transform:translateX(-50%);font-size:14px;letter-spacing:1.5px;color:var(--amber);
  background:var(--glass);border:1px solid var(--edge);padding:8px 14px;white-space:nowrap;
  opacity:0;transition:opacity .18s}
.buy.on{opacity:1}

.touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch.on{display:block}
.stick{position:absolute;left:calc(env(safe-area-inset-left,0px) + 24px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 32px);width:128px;height:128px;
  border:2px solid rgba(240,232,217,.18);border-radius:50%;pointer-events:auto}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
  border-radius:50%;background:rgba(240,232,217,.18);border:1px solid rgba(240,232,217,.3)}
.btn{position:absolute;pointer-events:auto;display:grid;place-items:center;border-radius:50%;
  background:var(--glass);border:2px solid rgba(240,232,217,.25);color:var(--ink);
  font-family:var(--hud);letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(2px)}
.btn.held{background:rgba(155,31,21,.6);border-color:var(--blood-hi)}
.btn.fire{right:calc(env(safe-area-inset-right,0px) + 22px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 38px);width:108px;height:108px;font-size:15px}
.btn.aim{right:calc(env(safe-area-inset-right,0px) + 144px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 54px);width:66px;height:66px;font-size:12px}
.btn.reload{right:calc(env(safe-area-inset-right,0px) + 34px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:60px;height:60px;font-size:11px}
.btn.knife{right:calc(env(safe-area-inset-right,0px) + 116px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:56px;height:56px;font-size:11px}
.btn.use{left:calc(env(safe-area-inset-left,0px) + 172px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 54px);width:60px;height:60px;font-size:12px}

.screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:8;
  background:radial-gradient(ellipse at 50% 44%,rgba(26,11,9,.86),rgba(4,3,3,.985));
  padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}
/* The pause screen dims nothing: it is there to be paused ON so the frame
   behind it can be photographed. Text gets a shadow instead of a backdrop. */
#s-pause{background:none}
#s-pause .in>*{text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
#s-pause .go{background:rgba(8,6,5,.6);backdrop-filter:blur(2px)}
/* The id above outranks .go:hover on background but not on colour, so a
   hovered Resume used to paint near-black text on a near-black box and the
   label vanished under the cursor. Both states are stated here together. */
#s-pause .go:hover{background:var(--amber);color:#090706}
#s-pause .go.alt:hover{background:rgba(240,232,217,.12);color:var(--ink)}
.screen[hidden]{display:none}
/* One stack, one rhythm. Everything on a screen is a direct child of .in and
   spacing comes from the gap, so nothing drifts out of alignment. */
.in{width:min(420px,100%);display:flex;flex-direction:column;gap:18px;align-items:center}
.screen h1{margin:0;font-weight:700;font-size:clamp(40px,13vw,62px);line-height:.9;
  letter-spacing:3px;color:var(--blood);text-transform:none;
  text-shadow:0 0 34px rgba(155,31,21,.55),0 3px 0 #000}
.sub{font-size:11px;font-weight:400;letter-spacing:4px;color:var(--faint);text-transform:uppercase}
.screen p{margin:0;font-size:15px;font-weight:300;line-height:1.55;color:var(--ink);
  opacity:.74;letter-spacing:.3px;max-width:34ch}
/* The logo: BROWSER in white over ZOMBIES in blood red. */
.wm{text-align:center;line-height:.9;margin:0}
.wm b{display:block;font-weight:700;font-size:clamp(44px,15vw,72px);letter-spacing:1px;color:#fff;
  text-transform:uppercase;text-shadow:0 3px 0 #000}
.wm i{display:block;font-style:normal;font-weight:700;font-size:clamp(42px,14.4vw,69px);
  letter-spacing:4px;text-transform:uppercase;color:var(--blood);
  text-shadow:0 0 26px rgba(155,31,21,.6),0 3px 0 #000}
.go{font-family:var(--hud);font-weight:600;font-size:18px;letter-spacing:4px;text-transform:uppercase;
  padding:14px 0;width:100%;max-width:280px;cursor:pointer;background:transparent;color:var(--amber);
  border:2px solid var(--amber);min-height:52px;transition:background .15s,color .15s}
.go:hover{background:var(--amber);color:#090706}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.go.alt{background:transparent;color:var(--faint);border-color:rgba(240,232,217,.2)}
.go.alt:hover{background:rgba(240,232,217,.1);color:var(--ink)}
.sens{display:flex;align-items:center;gap:14px;width:100%;max-width:280px;
  font-family:var(--hud);font-size:10px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.sens input{flex:1;min-width:0;height:44px;accent-color:var(--amber);
  touch-action:none;cursor:pointer;background:none}
.sens output{min-width:36px;text-align:right;color:var(--amber);
  font-variant-numeric:tabular-nums;letter-spacing:1px}
.stat{display:flex;gap:40px;font-size:11px;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
.stat b{display:block;margin-top:4px;font-size:30px;font-weight:600;letter-spacing:0;
  color:var(--amber);font-variant-numeric:tabular-nums}
.bar{width:180px;height:2px;background:rgba(240,232,217,.12)}
.bar i{display:block;height:100%;width:0;background:var(--blood);transition:width .25s}
#hint{font-size:10px;letter-spacing:2.5px;line-height:1.9;opacity:.75}
/* leaderboard */
.lbform{display:flex;gap:10px;align-items:stretch;width:100%;max-width:280px}
.lbform[hidden]{display:none}
.lbform input{flex:1;min-width:0;font-family:var(--hud);font-size:16px;font-weight:400;
  letter-spacing:3px;text-transform:uppercase;background:rgba(240,232,217,.05);
  border:1px solid rgba(240,232,217,.22);color:var(--ink);padding:0 12px;min-height:50px;
  text-align:center}
.lbform input::placeholder{color:var(--faint);opacity:.7;letter-spacing:2px}
.lbform input:focus{outline:none;border-color:var(--amber);background:rgba(233,194,113,.06)}
.lbform .go{width:auto;max-width:none;flex:0 0 auto;padding:0 20px;font-size:15px;letter-spacing:2px;
  min-height:50px;border-width:1px}
.lbnote{font-size:10px;letter-spacing:2.5px;color:var(--amber);min-height:12px;text-transform:uppercase}
.lb{border-collapse:collapse;font-size:13px;letter-spacing:.5px;width:100%;max-width:300px}
.lb td{padding:6px 4px;border-bottom:1px solid rgba(240,232,217,.07);color:var(--ink)}
.lb td:first-child{color:var(--faint);width:26px;text-align:left;font-size:11px}
.lb td:nth-child(2){text-align:left}
.lb td:nth-child(3),.lb td:nth-child(4){text-align:right;color:var(--faint);
  font-variant-numeric:tabular-nums;font-size:12px}
.lb tr.you td{color:var(--amber)}
/* The USE button pulses when there is something to use. On a phone the on-screen
   prompt is small and off to the side; the thing your thumb is looking for is
   the button, so that is what has to light up. */
@keyframes usePulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(233,194,113,.55), 0 0 16px 2px rgba(233,194,113,.35);
           border-color:var(--amber); transform:scale(1) }
  50%    { box-shadow:0 0 0 12px rgba(233,194,113,0), 0 0 26px 6px rgba(233,194,113,.5);
           border-color:#FFE6B0; transform:scale(1.07) }
}
.touch-button.live{ animation:usePulse 1.1s ease-in-out infinite;
  background:#2a200fcc; color:#FFE6B0 }
.touch-button.live span{ color:#FFE6B0 }
/* Can't afford it: present but not shouting. */
.touch-button.live.broke{ animation-duration:2.2s; color:#c9b68f;
  box-shadow:0 0 12px 1px rgba(233,194,113,.18); border-color:rgba(233,194,113,.45) }
/* And the prompt itself pulls a little harder. */
@keyframes buyPulse{ 0%,100%{opacity:.88} 50%{opacity:1} }
.buy.on{ animation:buyPulse 1.1s ease-in-out infinite }
/* Faraday's settings panel arrives with three paragraphs of instructions in the
   system font. On a phone that is the whole screen below the Start button.
   Keep the two controls that matter and dress them like everything else. */
#menu .menu-content{font-family:var(--hud);gap:14px;margin-top:6px}
#menu .menu-content p{display:none}
.touch-settings{font-family:var(--hud);font-size:11px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--faint);width:min(300px,86vw)}
.touch-settings label{gap:10px;justify-content:center}
.touch-settings input[type=range]{accent-color:var(--amber);max-width:140px}
.touch-settings output{color:var(--amber);letter-spacing:0;font-size:12px}
.touch-settings button{font-family:var(--hud);font-size:11px;letter-spacing:2.5px;
  text-transform:uppercase;background:transparent;color:var(--faint);
  border:1px solid rgba(240,232,217,.18);padding:10px 18px;min-height:44px;border-radius:0}
.touch-settings button:hover{color:var(--ink);border-color:rgba(240,232,217,.35)}
.touch-settings select{font-family:var(--hud);border-radius:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

// Pointer ownership is independent of DOM hit testing. A finger keeps its job
// until released, even when it crosses another control or leaves the screen.
class TouchInput {
  constructor({ onLook = () => {}, onAction = () => {} } = {}) {
    this.onLook = onLook;
    this.onAction = onAction;
    this.pointers = new Map();
    this.reset();
  }

  reset() {
    this.pointers.clear();
    this.forward = this.strafe = this.stickX = this.stickY = 0;
    this.sprint = this.aim = this.crouch = this.fire = false;
    this.jumpQueued = this.fireQueued = false;
  }

  begin(id, kind, x, y, radius = 50) {
    if (this.pointers.has(id) || [...this.pointers.values()].some(p => p.kind === kind)) return false;
    this.pointers.set(id, { kind, x, y, originX: x, originY: y, radius });
    if (kind === 'fire') this.fire = this.fireQueued = true;
    if (kind === 'jump') this.jumpQueued = true;
    if (kind === 'aim') this.aim = !this.aim;
    if (kind === 'crouch') this.crouch = !this.crouch;
    if (!['move', 'look', 'fire', 'jump', 'aim', 'crouch'].includes(kind)) this.onAction(kind);
    return true;
  }

  move(id, x, y) {
    const p = this.pointers.get(id);
    if (!p) return;
    if (p.kind === 'move') {
      const dx = (x - p.originX) / p.radius;
      const dy = (y - p.originY) / p.radius;
      const length = Math.hypot(dx, dy);
      const magnitude = clamp((length - 0.12) / 0.88, 0, 1);
      this.strafe = length ? dx / length * magnitude : 0;
      this.forward = length ? -dy / length * magnitude : 0;
      this.stickX = dx / Math.max(1, length) * p.radius;
      this.stickY = dy / Math.max(1, length) * p.radius;
      // Hysteresis prevents sprint chatter around the outer ring. Sideways
      // and backwards movement remain a walk; aiming/firing override sprint.
      this.sprint = this.forward > (this.sprint ? 0.72 : 0.92);
    } else if (p.kind === 'look' || p.kind === 'fire') {
      // With two aiming fingers down, fire owns the camera to avoid doubling
      // the turn. Track both positions so releasing fire cannot cause a jump.
      if (p.kind === 'fire' || !this.fire) this.onLook(x - p.x, y - p.y);
    }
    p.x = x;
    p.y = y;
  }

  end(id, cancelled = false) {
    const p = this.pointers.get(id);
    if (!p) return;
    this.pointers.delete(id);
    if (p.kind === 'move') {
      this.forward = this.strafe = this.stickX = this.stickY = 0;
      this.sprint = false;
    }
    if (p.kind === 'fire') {
      this.fire = false;
      if (cancelled) this.fireQueued = false;
    }
    if (cancelled && p.kind === 'jump') this.jumpQueued = false;
  }

  read() {
    const fire = this.fire || this.fireQueued;
    const input = {
      forward: this.forward, strafe: this.strafe,
      sprint: this.sprint && !this.aim && !fire && !this.crouch,
      crouch: this.crouch, aim: this.aim, fire, firePressed: this.fireQueued, jump: this.jumpQueued,
      use: this.held('use'), hack: this.held('hack'),
    };
    this.fireQueued = this.jumpQueued = false;
    return input;
  }

  held(kind) {
    return [...this.pointers.values()].some(p => p.kind === kind);
  }

  getState() {
    return {
      pointers: this.pointers.size, forward: this.forward, strafe: this.strafe,
      sprint: this.sprint && !this.aim && !this.fire && !this.crouch,
      aim: this.aim, crouch: this.crouch, fire: this.fire, use: this.held('use'), hack: this.held('hack'),
    };
  }
}

class TouchControls {
  constructor({ root, onLook, onAction, onModeChange = () => {}, onReset = () => {} }) {
    this.root = root;
    this.onReset = onReset;
    this.enabled = false;
    this.visible = false;
    this.mode = matchMedia('(pointer: coarse)').matches;
    this.sensitivity = 1;
    try {
      const saved = Number(localStorage.getItem('zombies.touchSensitivity'));
      if (saved > 0) this.sensitivity = clamp(saved, 0.4, 2);
    } catch { /* Storage is optional in private browsing and embedded games. */ }
    this.input = new TouchInput({
      onLook: (x, y) => onLook(x, y, this.sensitivity), onAction,
    });
    this.stick = root.querySelector('.touch-stick');
    this.knob = root.querySelector('.touch-knob');
    this.moveZone = root.querySelector('[data-touch="move"]');
    this.captures = new Map();
    const activate = (event) => {
      if (event.pointerType !== 'touch' || this.mode) return;
      this.mode = true;
      document.body.classList.add('touch-mode');
      onModeChange();
    };
    document.body.classList.toggle('touch-mode', this.mode);
    document.addEventListener('pointerdown', activate, { capture: true, passive: true });
    root.addEventListener('pointerdown', (event) => {
      const target = event.target.closest('[data-touch]');
      if (!this.enabled || event.pointerType !== 'touch' || !target) return;
      event.preventDefault();
      const kind = target.dataset.touch;
      const radius = this.stick.offsetWidth * 0.36;
      if (!this.input.begin(event.pointerId, kind, event.clientX, event.clientY, radius)) return;
      target.setPointerCapture(event.pointerId);
      this.captures.set(event.pointerId, target);
      if (kind === 'move') {
        const bounds = this.moveZone.getBoundingClientRect();
        this.stick.style.left = `${event.clientX - bounds.left}px`;
        this.stick.style.top = `${event.clientY - bounds.top}px`;
        this.stick.style.bottom = 'auto';
      }
      this.render();
    });
    root.addEventListener('pointermove', (event) => {
      if (!this.input.pointers.has(event.pointerId)) return;
      event.preventDefault();
      this.input.move(event.pointerId, event.clientX, event.clientY);
      this.render();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      root.addEventListener(type, (event) => {
        if(type !== 'pointerup' && this.input.pointers.has(event.pointerId)) this.onReset();
        this.input.end(event.pointerId, type !== 'pointerup');
        this.captures.delete(event.pointerId);
        this.render();
      });
    }
    root.addEventListener('contextmenu', event => event.preventDefault());
    // Rotation/browser chrome changes invalidate the stick origin and pointer
    // coordinates. Never carry movement or a held trigger into a new layout.
    addEventListener('resize', () => this.reset());
    globalThis.visualViewport?.addEventListener('resize', () => this.reset());
  }

  setSensitivity(value) {
    if (!Number.isFinite(Number(value))) return;
    this.sensitivity = clamp(Number(value), 0.4, 2);
    try { localStorage.setItem('zombies.touchSensitivity', String(this.sensitivity)); } catch {}
  }

  setEnabled(enabled, visible = enabled) {
    enabled = Boolean(enabled && this.mode);
    visible = Boolean(visible && this.mode);
    if (this.enabled && !enabled) this.reset();
    this.enabled = enabled;
    if (this.visible !== visible) {
      this.visible = visible;
      this.root.hidden = !visible;
    }
    this.root.classList.toggle('touch-disabled', !enabled);
  }

  reset() {
    this.input.reset();
    this.onReset();
    for (const [id, target] of this.captures) {
      if (target.hasPointerCapture(id)) target.releasePointerCapture(id);
    }
    this.captures.clear();
    this.render();
  }

  render() {
    const state = this.input.getState();
    this.knob.style.transform = `translate(${this.input.stickX}px, ${this.input.stickY}px)`;
    const moving = [...this.input.pointers.values()].some(p => p.kind === 'move');
    if (!moving) {
      this.stick.style.left = this.stick.style.top = this.stick.style.bottom = '';
    }
    this.stick.classList.toggle('engaged', moving);
    this.stick.classList.toggle('sprinting', state.sprint);
    this.stick.querySelector('span').textContent = state.sprint ? 'SPRINT' : 'MOVE';
    for (const button of this.root.querySelectorAll('button[data-touch]')) {
      const kind = button.dataset.touch;
      const pressed = kind === 'aim' || kind === 'crouch' ? state[kind]
        : [...this.input.pointers.values()].some(p => p.kind === kind);
      button.classList.toggle('pressed', pressed);
      if (kind === 'aim' || kind === 'crouch') button.setAttribute('aria-pressed', String(pressed));
    }
  }

  getState() {
    return { mode: this.mode, enabled: this.enabled, visible: this.visible,
      sensitivity: this.sensitivity, ...this.input.getState() };
  }
}


// Shared BO2 pointer controls, with the actions needed by both Zombies maps.
function createZombieTouch({ moon = false, onLook, onAction, onPause, onReset }) {
  const button = (kind, label, icon = '') => `<button type="button" class="touch-button touch-${kind}" data-touch="${kind}" aria-label="${label}">${icon}<span>${label}</span></button>`;
  const svg = content => `<svg viewBox="0 0 24 24" aria-hidden="true">${content}</svg>`;
  const root = document.createElement('div');
  root.id = 'touch-controls';
  root.hidden = true;
  root.setAttribute('aria-label', 'Touch game controls');
  root.innerHTML = `<div class="touch-look" data-touch="look"></div>
    <div class="touch-move" data-touch="move"><div class="touch-stick"><div class="touch-knob"></div><span>MOVE</span></div></div>
    ${button('fire', 'FIRE', svg('<circle cx="12" cy="12" r="7"/><path d="M12 1v6m0 10v6M1 12h6m10 0h6"/>'))}
    ${button('aim', 'AIM', svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/>'))}
    ${button('jump', 'JUMP', svg('<path d="m5 12 7-7 7 7M12 5v15"/>'))}
    ${button('crouch', 'CROUCH', svg('<path d="m5 12 7 7 7-7M12 19V4"/>'))}
    ${button('reload', 'RELOAD', svg('<path d="M19 8a8 8 0 1 0 0 9M19 3v6h-6"/>'))}
    ${button('use', 'USE', svg('<path d="M8 12V5a2 2 0 0 1 4 0v6l6 1v5l-4 4H9l-5-7 2-2 3 3"/>'))}
    ${button('melee', 'KNIFE', svg('<path d="m4 21 6-6m-3-3 6 6M9 14 20 3l-2 9-6 5"/>'))}
    <div class="touch-toolbar">
      ${button('weapon', 'WEAPON')}${button('grenade', 'GRENADE')}
      ${moon ? button('equipment', 'GERSH/QED') + button('suit', 'P.E.S.') + button('hack', 'HACK') + button('attachment', 'WAVE') + button('journal', 'OBJECTIVE') : button('claymore', 'CLAYMORE') + button('equipment', 'MONKEY') + button('attachment', 'ALT FIRE')}
    </div>
    <button type="button" class="touch-button touch-pause" id="touch-pause" aria-label="Pause">Ⅱ</button>`;
  document.body.append(root);
  const updateHints = () => {
    if (!moon) return;
    for (const selector of ['#menu .preview', '#journal p:last-child']) {
      const element = document.querySelector(selector);
      element.textContent = element.textContent.replace('Tab shows', 'OBJECTIVE shows').replace('Tab closes this panel.', 'Tap OBJECTIVE to close.');
    }
  };
  const controls = new TouchControls({ root, onLook, onAction, onReset, onModeChange: updateHints });
  if (controls.mode) updateHints();
  const settings = document.createElement('div');
  settings.className = 'touch-only touch-settings';
  settings.innerHTML = `<p>Left stick: move; push forward to sprint. Swipe right to look, or drag FIRE to aim while shooting. Tap AIM / CROUCH to toggle. Hold USE to repair${moon ? ', or HACK to hack' : ''}.</p>
    <label for="touch-sensitivity">Look sensitivity <input id="touch-sensitivity" type="range" min="0.4" max="2" step="0.1"><output id="touch-sensitivity-value" for="touch-sensitivity"></output></label>
    <p>Landscape gives you more room to aim.</p>
    <button type="button" id="touch-fullscreen" hidden>Full screen</button>`;
  document.querySelector(moon ? '#menu .panel' : '#menu .menu-content').append(settings);
  const slider = settings.querySelector('input');
  const value = settings.querySelector('output');
  slider.value = controls.sensitivity;
  value.textContent = `${controls.sensitivity.toFixed(1)}×`;
  slider.addEventListener('input', () => {
    controls.setSensitivity(slider.value);
    value.textContent = `${controls.sensitivity.toFixed(1)}×`;
  });
  const fullscreen = settings.querySelector('#touch-fullscreen');
  fullscreen.hidden = !document.fullscreenEnabled;
  fullscreen.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* Full screen is optional. */ }
  });
  // A third finger must be able to pause while move and fire are held.
  const pause = root.querySelector('#touch-pause');
  pause.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'touch') return;
    event.preventDefault();
    event.stopPropagation();
    onPause();
  });
  pause.addEventListener('click', event => {
    if (event.pointerType === 'touch' || event.sourceCapabilities?.firesTouchEvents) return;
    onPause();
  });
  return controls;
}

</script>
<script>
// Crash reporting. There was none, so a phone dying was indistinguishable from
// a phone being slow -- the server log showed every asset delivered with a 200
// and then nothing. These beacons land in the Caddy access log as 404s, which
// is enough to see what the device actually said.
(function(){
  function beacon(kind, msg){
    try{
      var u='/zerr?k='+encodeURIComponent(kind)+'&m='+encodeURIComponent(String(msg).slice(0,180))
           +'&w='+innerWidth+'&h='+innerHeight+'&dpr='+(devicePixelRatio||1);
      if(navigator.sendBeacon) navigator.sendBeacon(u); else new Image().src=u;
    }catch(e){}
  }
  window.addEventListener('error',function(e){
    // Line number included: "cannot set className of null" says nothing about
    // WHERE, and hunting it by eye across 1800 lines is how evenings vanish.

}
function nearBarrierSpot(x,z){

    if(Math.hypot(BARRIERS[i].x-x, BARRIERS[i].z-z) < 2.5) return true;
  return false;
}
function barrierBoardsLeft(b){ var n=0; for(var i=0;i<b.planks.length;i++) if(b.planks[i].up) n++; return n; }

function tearBoard(b){

    b.planks[i].up=false; b.planks[i].mesh.visible=false;

// Where the player starts on an imported map, and where zombies come from.
var MAPSPAWN=null, MAPSPAWNPTS=null;
// The imported map has no window list to hang spawns off, so find standing room
// the same way the player's feet do: ring the spawn, keep the points that sit on
// the same floor with headroom above them.
function buildMapSpawns(){
  if(!MAPSPAWN) return;
  var pts=[];
  // A grid, not a ring: this lobby is nine metres across, so a ring at any one
  // radius lands entirely in the walls. Cast from just above the floor -- from
  // overhead the ray meets the CEILING first and every cell looks four metres
  // too high, which is how the first pass found nothing at all.
  var RNG=26*MSCALE, STEP=1.5*MSCALE;
  for(var x=-RNG;x<=RNG;x+=STEP){
    for(var z=-RNG;z<=RNG;z+=STEP){
      var d=Math.hypot(x-MAPSPAWN.x, z-MAPSPAWN.z);
      if(d<3.5*MSCALE || d>14*MSCALE) continue;  // further than this and they are
                                    // in a room with no path back to you
      var fy=mapGroundAt(x,z,MAPSPAWN.y+1.2);
      if(fy===null || Math.abs(fy-MAPSPAWN.y)>1.2) continue;
      if(mapCeilAt(x,z,fy) < 1.0) continue;         // no headroom: inside a wall
      if(!cgInPlay(x,z) || cgOutsideAt(x,z,fy)) continue;   // out in the street
      pts.push({x:x, z:z, y:fy, a:0});
    }
  }
  if(pts.length>=3) MAPSPAWNPTS=pts;
  window.__MAPSPAWNS=pts.length;
}
function mapGroundAt(x,z,fromY){
  var k=cgIndex(x,z); if(k<0) return null;
  var f=CG.floors[k]; if(!f) return null;
  for(var i=0;i<f.length;i++) if(f[i]<=fromY+0.05) return f[i];
  return null;
}
function mapBlocked(fromX,fromY,fromZ,dx,dz){
  if(!CG) return false;
  var len=Math.hypot(dx,dz);
  if(len<0.0001) return false;
  var ux=dx/len, uz=dz/len;
  // Measure the body from the FLOOR, not from the height the caller passed.
  // Anchored to the caller, the bottom of the body sat 0.55 above the tread you
  // were on -- and the riser two or three steps up the flight reached into that
  // band and read as a wall, so you could jump up a staircase but not walk it.
  // The band has to start above STEPUP, since anything lower is a step the
  // floor test below will judge instead.
  var here=mapGroundAt(fromX,fromZ,fromY+0.8);
  var lo, hi;
  if(here!==null){
    lo=here+STEPUP+0.06;
    // Duck rather than refuse. A fixed 1.75 body walled the player out of every
    // low opening in the model, Quick Revive's among them; under a low lintel
    // you crouch, and only an opening under 0.95 is impassable.
    var ceilAhead=mapCeilAt(fromX+ux*(len+0.40), fromZ+uz*(len+0.40), here);
    if(ceilAhead<0.95) return true;
    hi=here+Math.min(1.75, ceilAhead-0.10);
    if(hi<=lo) hi=lo+0.05;
  }
  else { lo=fromY-0.30; hi=fromY+0.40; }
  if(cgWallHit(fromX+ux*(len+0.24), fromZ+uz*(len+0.24), lo, hi)) return true;
  if(cgWallHit(fromX+ux*(len+0.50), fromZ+uz*(len+0.50), lo, hi)) return true;
  // Low obstacles are judged by the floor instead: a tread is a step up, a
  // parapet is a wall.
  var there=mapGroundAt(fromX+ux*0.75, fromZ+uz*0.75, fromY+0.8);
  if(there===null) return false;            // over an edge: gravity's problem
  if(here!==null && there-here>STEPUP) return true;
  // Don't walk out of the building -- through the back door, or over the roof.
  // Already outside (a zombie at a window, or a bad drop) you may still move, or
  // you would be stuck in the street.
  var ox=fromX+ux*(len+0.45), oz=fromZ+uz*(len+0.45);
  // Off the edge of the playable area, by any route.
  if(CG.play && cgInPlay(fromX,fromZ) && !cgInPlay(ox,oz)) return true;
  // And a second guard for the level you are actually on, so you cannot walk
  // out over the roof of a room that is itself in play.
  if(here!==null && cgOutsideAt(ox,oz,there) && !cgOutsideAt(fromX,fromZ,here)) return true;
  return false;
}
function box(x,y,z,w,h,d,mat,solid){
  var m=new THREE.Mesh(BOX,mat||M.wall);
  m.position.set(x,y+h/2,z);m.scale.set(w,h,d);scene.add(m);
  if(solid!==false&&h>1.2)walls.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});

}
function plane(x,y,z,w,d,mat,flip){

function buildMap(){
  // ---- SPAWN ROOM ----
  // Built from reference. Two flights climb left and right and MEET at a
  // central landing across the back; an arched passage runs underneath it.
  // Chandelier centre, coffered ceiling, arched niches down the walls,
  // Quick Revive in a right-hand alcove, teleporter pad on the floor.
  var HW=11.5, HZ1=19.0, CEIL=7.0, MEZZ=4.6;
  plane(0,0,HZ1/2, HW*2, HZ1, M.lobbyFloor);
  plane(0,CEIL,HZ1/2, HW*2, HZ1, M.ceiling, true);

  // coffered ceiling: a grid of sunken panels reads as period plasterwork
  for(var cx=-9;cx<=9;cx+=4.5){
    box(cx,CEIL-0.35,HZ1/2,0.45,0.35,HZ1-1.0,M.gilt,false);
  }
  for(var cz=3;cz<=HZ1-2;cz+=4.5){
    box(0,CEIL-0.35,cz,HW*2-1.0,0.35,0.45,M.gilt,false);
  }

  WINDOWS=[];
  function wallRun(wx,gaps){
    var at=0.0, segs=[];
    gaps.forEach(function(g){ segs.push([at,g[0]]); at=g[1]; });
    segs.push([at,HZ1]);
    segs.forEach(function(sg){
      var L=sg[1]-sg[0]; if(L<=0.05) return;
      box(wx,0,(sg[0]+sg[1])/2,.7,CEIL,L,M.wall);
    });
    gaps.forEach(function(g){
      var c=(g[0]+g[1])/2, L=g[1]-g[0];
      box(wx,0,c,.7,1.0,L,M.wall,false);
      box(wx,2.9,c,.7,CEIL-2.9,L,M.wall,false);
      WINDOWS.push({x:wx,z:c,rot:Math.PI/2});
    });
  }
  box(0,0,0,HW*2,CEIL,.7,M.wall);                       // solid behind you
  wallRun(-HW,[[3.2,5.6],[8.4,10.8]]);
  wallRun( HW,[[3.2,5.6]]);

  // tall arched niches down the right wall, as in the reference
  for(var nz=8.0;nz<17.0;nz+=2.9){
    box(HW-0.45,0.4,nz,0.35,4.4,2.0,M.wallRed,false);
    box(HW-0.5,4.8,nz,0.5,0.4,2.3,M.gilt,false);
  }

  // --- twin flights meeting at a central landing ---
  var SZ0=4.0, SZ1=14.6, STEPS=18, SW=3.6;
  var sd=(SZ1-SZ0)/STEPS, sr=MEZZ/STEPS;
  [-1,1].forEach(function(side){
    var cx=side*(HW-SW/2-0.5);
    for(var i=0;i<STEPS;i++){
      box(cx,(i+1)*sr-sr, SZ0+i*sd+sd/2, SW, sr, sd, M.wood, false);
    }
    RAMPS.push({x0:cx-SW/2,x1:cx+SW/2,z0:SZ0,z1:SZ1,y0:0,y1:MEZZ});
    box(cx-side*(SW/2+0.3),0,(SZ0+SZ1)/2,0.45,MEZZ+0.5,SZ1-SZ0,M.wall);
  });
  // the landing both flights arrive on, spanning the back
  PLATFORMS.push({x0:-HW,x1:HW,z0:SZ1,z1:HZ1,y:MEZZ});
  box(0,MEZZ-0.35,(SZ1+HZ1)/2,HW*2,0.35,HZ1-SZ1,M.wood,false);
  if(PROPS.railing){
    for(var rx=-9.6;rx<=9.6;rx+=2.6){
      if(Math.abs(rx)>HW-SW-1.0) continue;
      place('railing', rx, SZ1-0.15, {size:2.6, y:MEZZ, rotY:0});
    }
  }
  // the arch underneath, leading onward
  var AW=5.4;
  box(-(AW/2+(HW-AW/2)/2),0,SZ1+1.2,HW-AW/2,MEZZ,0.6,M.wall);
  box( (AW/2+(HW-AW/2)/2),0,SZ1+1.2,HW-AW/2,MEZZ,0.6,M.wall);
  for(var ai=0;ai<7;ai++){                                  // stepped arch head
    var t=(ai+0.5)/7, aw=AW*Math.sqrt(1-Math.pow(2*t-1,2));
    box(0,MEZZ-0.55-ai*0.14,SZ1+1.2,Math.max(0.3,AW-aw),0.16,0.62,M.gilt,false);
  }
  lamp(0,2.4,SZ1+2.6,0xFFC890,1.6,13);                      // light through the arch

  // --- Quick Revive alcove, right-hand wall ---
  var QX0=HW, QX1=HW+5.2, QZ0=12.0, QZ1=17.0;
  plane((QX0+QX1)/2,0,(QZ0+QZ1)/2, QX1-QX0, QZ1-QZ0, M.lobbyFloor);
  plane((QX0+QX1)/2,4.6,(QZ0+QZ1)/2, QX1-QX0, QZ1-QZ0, M.ceiling, true);
  box((QX0+QX1)/2,0,QZ0,QX1-QX0,4.6,.7,M.wall);
  box((QX0+QX1)/2,0,QZ1,QX1-QX0,4.6,.7,M.wall);
  box(QX1,0,(QZ0+QZ1)/2,.7,4.6,QZ1-QZ0,M.wall);
  box(HW,0,(QZ0+QZ1)/2,.7,4.6,QZ1-QZ0,M.wall,false);        // opening in the side wall
  lamp(QX1-1.6,2.8,(QZ0+QZ1)/2,0x6FC0E8,2.2,11);
  if(PROPS.perks) place('perks', QX1-1.5, (QZ0+QZ1)/2, {size:2.2, rotY:-Math.PI/2, solid:true});

  // banners
  [[-HW+0.6,6.5,Math.PI/2],[HW-0.6,9.5,-Math.PI/2]].forEach(function(bn){
    var ban=new THREE.Mesh(new THREE.PlaneGeometry(1.5,3.4),
      new THREE.MeshStandardMaterial({color:0x7A1410,roughness:1,side:THREE.DoubleSide}));
    ban.position.set(bn[0],3.6,bn[1]); ban.rotation.y=bn[2]; scene.add(ban);
  });

  chandelier(0,8.5,CEIL-1.0);
  lamp(-7.0,4.4,3.0,0xFFBE78,1.3,15); lamp(7.0,4.4,3.0,0xFFBE78,1.3,15);
  lamp(0,4.6,9.5,0xFFD2A0,1.1,16);

  doors.push(addDoorX(-HW,9.6,2.4,'Open the doors',750));

  // ---- CORRIDOR ----
  plane(0,0,-7,9,13,M.corrFloor); plane(0,4.6,-7,9,13,M.ceiling,true);
  box(-4.7,0,-7,.7,4.6,13,M.conc); box(4.7,0,-7,.7,4.6,13,M.conc);
  lamp(0,3.9,-3.5,0xC87A48,1.6,15); lamp(0,3.9,-8,0xB05C34,1.4,14);
  lamp(0,3.9,-12,0xA04E2E,1.2,13);
  doors.push(addDoor(0,-13.4,5.6,'Open the auditorium',1250));

  // ---- AUDITORIUM ----
  plane(0,0,-28,32,30,M.hallFloor); plane(0,8.2,-28,32,30,M.ceiling,true);
  box(-16.2,0,-28,.7,8.2,30,M.wallRed); box(16.2,0,-28,.7,8.2,30,M.wallRed);
  box(-10.5,0,-13.4,11,8.2,.7,M.wallRed); box(10.5,0,-13.4,11,8.2,.7,M.wallRed);
  // proscenium + stage

  box(0,6.4,-34.2,25,1.8,1.2,M.gilt,false);
  column(-11.6,-33.8,6.4,.6); column(11.6,-33.8,6.4,.6);
  // balcony
  box(-16,4.4,-24,1.6,.5,18,M.gilt,false); box(16,4.4,-24,1.6,.5,18,M.gilt,false);
  // seating

  chandelier(0,-24,7.6); chandelier(-9,-31,7.2); chandelier(9,-31,7.2);
  lamp(0,2.2,-37,0x6E8CC8,1.3,22);
  lamp(-14,2.6,-20,0xB02A1E,1.1,16); lamp(14,2.6,-20,0xB02A1E,1.1,16);
  lamp(-7,3.4,-26,0xFF9A5A,0.9,15); lamp(7,3.4,-26,0xFF9A5A,0.9,15);
  buys.push(addBuy(-15.4,-24,Math.PI/2,'Trench Gun',1500,'shotgun'));
  buys.push(addBuy(15.4,-24,-Math.PI/2,'Carbine',1200,'rifle'));
}
// ?map=<name> swaps the hand-built rooms for a Collada map, so a downloaded
// layout can be judged by walking it rather than guessed at from an orbit view.
// Kino IS the game now, so it is the default. ?map=off plays the hand-built
// rooms, ?map=<name> loads another Collada folder.
var DAEMAP=(function(){
  var m=/[?&]map=([A-Za-z0-9_-]+)/.exec(location.search);
  return m ? m[1] : 'kino';
})();
var MOBILE=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
// Phones used to be sent to the hand-built map, from when this was 255k
// triangles with no viewport meta and a 8-megapixel canvas. The map is the game
// now, so they get it; the pixel ratio cap and the viewport tag carry the load,
// and ?map=off falls back if a device cannot cope. The crash beacon reports it
// either way.
if(DAEMAP==='off'){
  DAEMAP=null;
  buildMap();
} else if(DAEMAP){
  pending++;                                   // gate Start on the map arriving
  // GLB where one exists. Collada reported this map's size three different ways
  // depending on when it was asked; a GLB declares its bounds in the file and
  // has measured correctly every time today.
  var loadMap = (DAEMAP==='kino')
    ? function(cb,err){ new THREE.GLTFLoader().load('models/kino.glb',
        function(g){ cb({scene:g.scene}); }, undefined, err); }
    : function(cb,err){ new THREE.ColladaLoader().load('kino/'+DAEMAP+'/model.dae', cb, undefined, err); };
  loadMap(function(col){
   try{
    // Lights FIRST. They were added after the measuring code, so any throw in
    // there left the map loaded but pitch black -- which is indistinguishable
    // from the map not loading at all.
    //
    // ONE set, and the scene's own lights go first. There were three stacked
    // sets -- the base scene's, one here, and another further down -- totalling
    // 1.6 ambient, 1.6 hemisphere and 2.2 directional. At that much light a
    // mid-grey surface clips to pure white, which is what the white wedges on
    // the stairs and walls were: not missing textures, blown-out ones.
    (function(){
      var kill=[];
      scene.traverse(function(o){
        if(o.isAmbientLight||o.isHemisphereLight||o.isDirectionalLight) kill.push(o);
      });
      kill.forEach(function(o){ if(o.parent) o.parent.remove(o); });
    })();
    scene.add(new THREE.AmbientLight(0xFFFFFF,0.30));
    scene.add(new THREE.HemisphereLight(0xBFC8DD,0x2A2520,0.35));
    var sunA=new THREE.DirectionalLight(0xFFF2DC,0.55); sunA.position.set(1,2,1); scene.add(sunA);
    var sunB=new THREE.DirectionalLight(0xBFD0FF,0.20); sunB.position.set(-1,1.5,-1); scene.add(sunB);
    // No tone mapping: ACES changed the whole look for the worse and the
    // clipping it was covering for is gone now the lights are not tripled and
    // the untextured fill is the colour it was meant to be. ?aces=1 to compare.
    if(/[?&]aces=1/.test(location.search)){
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.25;
    }
    scene.fog=null;
    var root=col.scene;
    // SketchUp exports its EDGES as line primitives, and the GLB carries 85,734
    // vertices of them: a grey wireframe drawn over every surface in the map.
    // That is the "white lines around everything" -- nothing to do with
    // materials, lighting or depth, which is where three separate hunts looked.
    (function(){
      var lines=[];
      root.traverse(function(o){ if(o.isLine||o.isLineSegments||o.isLineLoop) lines.push(o); });
      lines.forEach(function(o){ if(o.parent) o.parent.remove(o);
        if(o.geometry) o.geometry.dispose(); });

// Every model so far has arrived with its geometry somewhere other than its
// origin and a scale that means nothing. Measuring the geometry with world
// matrices applied -- at scale 1, before anything else -- is the only method
// that has worked on all of them, so every prop goes through this.
function place(name, x, z, opts){
  opts = opts || {};
  var src = PROPS[name];
  if(!src) return null;
  var g = src.clone(true);
  g.scale.setScalar(1); g.position.set(0,0,0); g.rotation.set(0,0,0);
  g.updateMatrixWorld(true);
  var bb = new THREE.Box3(), any = false;
  g.traverse(function(o){
    if(o.isMesh||o.isSkinnedMesh){
      o.geometry.computeBoundingBox();
      if(o.geometry.boundingBox){
        var b = o.geometry.boundingBox.clone();
        b.applyMatrix4(o.matrixWorld);
        bb.union(b); any = true;
      }
    }
  });
  if(!any) return null;
  var sz = new THREE.Vector3(), c = new THREE.Vector3();
  bb.getSize(sz); bb.getCenter(c);
  var span = opts.byHeight ? sz.y : Math.max(sz.x, sz.y, sz.z);
  var k = span > 0.0001 ? (opts.size || 1) / span : 1;
  g.scale.setScalar(k);
  g.position.set(-c.x * k, -bb.min.y * k, -c.z * k);   // centred, feet on zero
  var holder = new THREE.Group();
  holder.add(g);
  holder.position.set(x, opts.y || 0, z);
  holder.rotation.y = opts.rotY !== undefined ? opts.rotY : Math.random() * 6.28;
  if(opts.tilt) holder.rotation.z = opts.tilt;
  scene.add(holder);
  if(opts.solid){
    var r = (opts.size || 1) * 0.42;
    walls.push({x0:x-r, x1:x+r, z0:z-r, z1:z+r});
  }

}

  // from the loader, so measuring the clone as-is returns the ALREADY-SCALED

  // 0.01 scale with 1.15 and produced a thirty-metre pistol wrapped around the

var AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function noiseBuf(ctx,dur){
  var n=ctx.sampleRate*dur,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  return b;
}
function shot(kind){
  var c=audio();if(!c)return;
  var s=c.createBufferSource();s.buffer=noiseBuf(c,kind==='shotgun'?.34:.2);
  var f=c.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(kind==='shotgun'?1700:2600,c.currentTime);
  f.frequency.exponentialRampToValueAtTime(220,c.currentTime+.18);
  var g=c.createGain();g.gain.setValueAtTime(kind==='shotgun'?.5:.33,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(kind==='shotgun'?.34:.2));
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
// Splintering wood: a noise crack through a band-pass, plus a low thud. A
// gunshot sample stood in for this and every board sounded like a pistol.
function woodSnap(pull){
  var c=audio();if(!c)return;
  var s=c.createBufferSource();s.buffer=noiseBuf(c,.16);
  var f=c.createBiquadFilter();f.type='bandpass';
  f.frequency.setValueAtTime(pull?1500:900,c.currentTime);
  f.frequency.exponentialRampToValueAtTime(pull?320:260,c.currentTime+.13);
  f.Q.value=1.6;
  var g=c.createGain();g.gain.setValueAtTime(.30,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
  var o=c.createOscillator(),g2=c.createGain();
  o.type='triangle';o.frequency.setValueAtTime(pull?140:190,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(60,c.currentTime+.12);
  g2.gain.setValueAtTime(.16,c.currentTime);
  g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+.14);
  o.connect(g2);g2.connect(c.destination);o.start();o.stop(c.currentTime+.15);
}
// A footfall: a short filtered thump. Without this you glide -- the camera bob
// alone reads as floating rather than walking.

  var c=audio();if(!c)return;
  var s=c.createBufferSource();s.buffer=noiseBuf(c,.09);
  var f=c.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(760,c.currentTime);
  f.frequency.exponentialRampToValueAtTime(190,c.currentTime+.08);
  var g=c.createGain();g.gain.setValueAtTime(.085+Math.random()*.03,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
function land(){
  var c=audio();if(!c)return;
  var s=c.createBufferSource();s.buffer=noiseBuf(c,.16);
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(420,c.currentTime);
  var g=c.createGain();g.gain.setValueAtTime(.2,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
function groan(){
  var c=audio();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
  o.type='sawtooth';o.frequency.setValueAtTime(64+Math.random()*34,c.currentTime);
  o.frequency.linearRampToValueAtTime(42+Math.random()*20,c.currentTime+.75);
  f.type='bandpass';f.frequency.value=320;f.Q.value=3.2;
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(.1,c.currentTime+.14);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.8);
  o.connect(f);f.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.85);

function sting(){
  var c=audio();if(!c)return;
  [110,146.8,174.6].forEach(function(hz,i){
    var o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.value=hz;
    g.gain.setValueAtTime(0,c.currentTime+i*.07);

// The world was one flat floor. Kino is vertical -- stairs, a balcony, a

function groundAt(x,z){
  var h=0, i, p;
  for(i=0;i<PLATFORMS.length;i++){
    p=PLATFORMS[i];
    if(x>p.x0&&x<p.x1&&z>p.z0&&z<p.z1&&p.y>h) h=p.y;
  }
  for(i=0;i<RAMPS.length;i++){
    var r=RAMPS[i];
    if(x>r.x0&&x<r.x1&&z>r.z0&&z<r.z1){
      var t=(z-r.z0)/(r.z1-r.z0);
      var y=r.y0+(r.y1-r.y0)*Math.max(0,Math.min(1,t));

}

function reachable(s){

var ray=new THREE.Raycaster(),muzzle=new THREE.PointLight(0xFFD9A0,0,11,2);scene.add(muzzle);
function fire(){
  var g=GUNS[P.gun];
  if(P.reloading>0||P.cool>0||P.dead)return;
  if(P.ammo<=0){reload();return;}
  P.ammo--;P.cool=60/g.rpm;P.recoil=g.kick;
  muzzle.position.copy(P.pos);muzzle.intensity=3.0;
  vmParts.flash.visible=true;flashT=.045;shot(P.gun);
  var meshes=[];
  zombies.forEach(function(z){ if(z.dead)return;
    z.hit.userData.z=z; z.head.userData.z=z; meshes.push(z.hit,z.head); });
  for(var p=0;p<g.pellets;p++){
    var dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    var sp=g.spread*(P.aiming?.4:1);
    dir.x+=(Math.random()-.5)*sp;dir.y+=(Math.random()-.5)*sp;dir.normalize();
    ray.set(P.pos,dir);
    var hits=ray.intersectObjects(meshes,false);
    if(hits.length){
      var z=hits[0].object.userData.z;
      var head=hits[0].object===z.head;
      hurtZombie(z,g.dmg*(head?2.5:1),head,hits[0].point);
    }
  }

}
function hurtZombie(z,amt,head,at){
  if(z.dead)return;

    z.dead=true; alive--; P.kills++; P.pts+=head?100:60; thud();
    z.dieT=1.6;
    if(z.actions&&z.actions.die){
      if(z.actions[z.state]) z.actions[z.state].fadeOut(0.1);
      z.actions.die.reset().fadeIn(0.1).play(); z.state='die';
    } else { scene.remove(z.g); }

}

var nearBuy=null;
function checkNear(){
  var best=null,bd=3.0;
  for(var wi=0;wi<WALLBUYS.length;wi++){
    var wb=WALLBUYS[wi];
    var q3=Math.hypot(P.pos.x-wb.x, P.pos.z-wb.z);
    if(q3<bd && Math.abs(P.pos.y-P.eye-wb.fy)<1.6){
      bd=q3;
      best = (P.gun===wb.key)
        ? {kind:'ammo', o:wb, label:wb.name+' ammo', cost:Math.round(wb.cost/2)}
        : {kind:'buy',  o:wb, label:wb.name,        cost:wb.cost};
    }
  }
  // A barrier missing boards is the nearest thing worth using.
  for(var bi=0;bi<BARRIERS.length;bi++){
    var bb2=BARRIERS[bi];
    if(barrierBoardsLeft(bb2)>=bb2.planks.length) continue;
    var q2=Math.hypot(P.pos.x-bb2.inX, P.pos.z-bb2.inZ);
    if(q2<bd && Math.abs(P.pos.y-P.eye-bb2.floorY)<1.6){
      bd=q2;
      best={kind:'barrier',o:bb2,cost:0,
            label:'Rebuild barrier  '+barrierBoardsLeft(bb2)+'/'+bb2.planks.length};
    }
  }
  doors.forEach(function(d){if(d.open)return;
    var q=Math.hypot(P.pos.x-d.x,P.pos.z-d.z);if(q<bd){bd=q;best={kind:'door',o:d,label:d.label,cost:d.cost};}});
  buys.forEach(function(b){
    var q=Math.hypot(P.pos.x-b.x,P.pos.z-b.z);if(q<bd){bd=q;best={kind:'buy',o:b,label:b.name,cost:b.cost};}});
  nearBuy=best;var e=el('h-buy');
  if(best){ e.textContent = best.cost
      ? best.label+' \u2014 '+best.cost+(TOUCH?'   TAP USE':'   [E]')
      : best.label+' \u2014 +10 each'+(TOUCH?'   TAP USE':'   HOLD [E]');
    e.className='buy on'; }
  else e.className='buy';
}
function use(){
  if(!nearBuy||P.dead)return;
  if(nearBuy.kind==='barrier'){
    var bb3=nearBuy.o;
    autoRebuild=bb3;                           // keep going without more input
    if(bb3.rebuildT>0) return;                 // one board at a time
    nailOne(bb3);
    return;
  }
  if(P.pts<nearBuy.cost){toast('Not enough points');return;}
  if(nearBuy.kind==='ammo'){
    var ag=GUNS[nearBuy.o.key];
    if(P.reserve>=ag.res){ toast('Ammo full'); return; }
    P.pts-=nearBuy.cost; P.reserve=ag.res; toast('Ammo'); hud(); checkNear(); return;
  }
  P.pts-=nearBuy.cost;
  if(nearBuy.kind==='door'){var d=nearBuy.o;d.open=true;scene.remove(d.grp);
    var i=walls.indexOf(d.wall);if(i>=0)walls.splice(i,1);toast('Opened');}
  else{var b=nearBuy.o,g=GUNS[b.key];P.gun=b.key;P.ammo=g.mag;P.reserve=g.res;P.reloading=0;
    setViewModel(b.key);toast(g.name);}
  hud();checkNear();
}

    P.gun=key; P.ammo=g.mag; P.reserve=g.res; P.reloading=0;
    setViewModel(key); hud(); return g.name; },
  vminfo:function(){ var n=0,t=0;
    camera.traverse(function(o){ if(o.isMesh){ n++;
      t += (o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3; } });
    return {meshes:n, tris:Math.round(t), holding:vmParts.realKind||null}; },
  navinfo:function(){ return {cellsReachable:NAVN, built:!!NAV}; },
  inplay:function(x,z){ return cgInPlay(x,z); },
  lightsum:function(){ var a=0,h=0,d=0;
    scene.traverse(function(o){ if(o.isAmbientLight)a+=o.intensity;
      else if(o.isHemisphereLight)h+=o.intensity; else if(o.isDirectionalLight)d+=o.intensity; });
    return {ambient:+a.toFixed(2), hemi:+h.toFixed(2), dir:+d.toFixed(2), total:+(a+h+d).toFixed(2),
            exposure:renderer.toneMappingExposure}; },
  look:function(yaw,pitch){ P.yaw=yaw; if(pitch!==undefined)P.pitch=pitch; },
  spawn:function(){ spawnOne(); },
  scene:scene, camera:camera
};
})();
</script>
