# ---------------------------------------------------------------------------
# browserzombies.fun -- Browser Zombies on its own name.
#
# Deliberately NOT a catch-all proxy to the engine. This origin serves the game
# and nothing else: the Lost City client, the woodcutting site and the ledger
# stay on woodcutting.fun. Two products, two origins, no accidental overlap.
# ---------------------------------------------------------------------------
# No www block: the registrar already owns a www record for this domain, and a
# site block for a hostname that does not resolve makes Caddy retry an ACME
# challenge it can never pass. Add it back if www is ever pointed here.

browserzombies.fun {
	encode zstd gzip

	log {
		output file /var/log/caddy/zombies.log {
			roll_size 20MiB
			roll_keep 5
		}
		format filter {
			wrap json
			fields {
				request>remote_ip ip_mask {
					ipv4 24
					ipv6 32
				}
				request>headers>Cookie delete
			}
		}
	}

	# The game itself at the root.
	@game path / /index.html /zombies /zombies/ /zombies.html
	handle @game {
		rewrite * /zombies.html
		reverse_proxy 127.0.0.1:8888
	}

	# Leaderboard. Same two routes as the other origin.
	@zscores path /api/zscores /api/zscore
	handle @zscores {
		uri strip_prefix /api
		reverse_proxy 127.0.0.1:8951
	}

	# Only the asset trees the game loads.
	@assets path /zmodels/* /ztex/* /zfbx/* /zerr /favicon.ico
	handle @assets {
		reverse_proxy 127.0.0.1:8888
	}

	# Everything else belongs to the other site.
	handle {
		respond 404
	}
}
